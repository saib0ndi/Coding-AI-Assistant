version: '3.8'

services:
  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - mcp-server-1
      - mcp-server-2
      - mcp-server-3

  # Multiple MCP Server instances
  mcp-server-1:
    build: .
    environment:
      - PORT=3077
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-127.0.0.1:11434}
      - INSTANCE_ID=1
    ports:
      - "3077:3077"

  mcp-server-2:
    build: .
    environment:
      - PORT=3078
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-127.0.0.1:11434}
      - INSTANCE_ID=2
    ports:
      - "3078:3078"

  mcp-server-3:
    build: .
    environment:
      - PORT=3079
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-127.0.0.1:11434}
      - INSTANCE_ID=3
    ports:
      - "3079:3079"

  # Redis for distributed caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  # Monitoring
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

networks:
  default:
    driver: bridge
