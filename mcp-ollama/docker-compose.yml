services:
  mcp-ollama:
    build: .
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3078
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
      - OLLAMA_ALLOWED_HOSTS=${OLLAMA_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3078
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3078/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
