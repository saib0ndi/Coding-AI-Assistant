<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP-Ollama Copilot - UI Test</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-color: #4CAF50;
            --warning-color: #FF9800;
            --error-color: #F44336;
            --border-radius: 12px;
            --shadow: 0 2px 12px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --vscode-editor-background: #1e1e1e;
            --vscode-editor-foreground: #d4d4d4;
            --vscode-titleBar-activeBackground: #2d2d30;
            --vscode-panel-border: #3e3e42;
            --vscode-input-background: #3c3c3c;
            --vscode-input-border: #3e3e42;
            --vscode-focusBorder: #007acc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--vscode-titleBar-activeBackground);
            border-bottom: 1px solid var(--vscode-panel-border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .logo-icon {
            font-size: 24px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-container {
            border-top: 1px solid var(--vscode-panel-border);
            padding: 24px;
        }

        .input-wrapper {
            background: var(--vscode-input-background);
            border: 2px solid var(--vscode-input-border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
        }

        .message-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--vscode-editor-foreground);
            font-size: 14px;
            outline: none;
            padding: 8px;
        }

        .send-button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <span class="logo-icon">🚀</span>
            <span>MCP-Ollama Copilot</span>
        </div>
        <div class="status-indicator">
            <span>✅ Ready</span>
        </div>
    </div>

    <div class="chat-container">
        <div class="messages-container">
            <div class="welcome-message">
                <div class="welcome-title">🎯 Ready to Code!</div>
                <p>Your AI coding assistant is ready to help!</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input class="message-input" placeholder="Ask me anything about your code..." />
                <button class="send-button">Send ➤</button>
            </div>
        </div>
    </div>
</body>
</html>
