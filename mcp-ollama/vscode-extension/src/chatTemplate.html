<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP-Ollama Copilot</title>
    <style>
        body {
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            margin-bottom: 10px;
            min-height: 200px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            word-wrap: break-word;
        }
        .message.user {
            background-color: var(--vscode-inputOption-activeBackground);
            margin-left: 20px;
        }
        .message.assistant {
            background-color: var(--vscode-editor-inactiveSelectionBackground);
            margin-right: 20px;
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border: 1px solid var(--vscode-input-border);
            border-radius: 8px;
            background-color: var(--vscode-input-background);
            padding: 8px;
        }
        .input-box {
            flex: 1;
            background: none;
            border: none;
            color: var(--vscode-input-foreground);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 20px;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .send-button {
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            padding: 8px 12px;
            font-size: 14px;
        }
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="messages" id="messages" role="log" aria-live="polite">
        <div class="message assistant">
            <div>Hello! I'm your AI coding assistant. How can I help you today?</div>
        </div>
    </div>
    
    <div class="input-wrapper">
        <textarea class="input-box" id="messageInput" placeholder="Ask me anything..." rows="1"></textarea>
        <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>Send</button>
    </div>
    
    <script>
        const vscode = acquireVsCodeApi();
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            updateSendButton();
            
            vscode.postMessage({
                command: 'sendMessage',
                text: message
            });
        }
        
        function addMessage(sender, text) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender;
            messageDiv.textContent = text;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function updateSendButton() {
            const input = document.getElementById('messageInput');
            const button = document.getElementById('sendButton');
            button.disabled = !input.value.trim();
        }
        
        document.getElementById('messageInput').addEventListener('input', updateSendButton);
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'response') {
                addMessage('assistant', message.text || 'No response');
            }
        });
    </script>
</body>
</html>
